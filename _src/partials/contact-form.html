<form class="form-card" action="#" method="post" novalidate>
  <!-- 그누보드 연결 시 action·hidden 필드는 개발 쪽에서 교체 -->
  <fieldset class="field">
    <legend class="field__label">문의 유형 <em>*</em></legend>
    <div class="chips">
      <label class="chip-radio"><input type="radio" name="inq_type" value="국내 거래" checked><span>국내 거래 (병원·약국)</span></label>
      <label class="chip-radio"><input type="radio" name="inq_type" value="해외 수출"><span>해외 수출</span></label>
      <label class="chip-radio"><input type="radio" name="inq_type" value="제품 구매"><span>제품 구매</span></label>
      <label class="chip-radio"><input type="radio" name="inq_type" value="기타"><span>기타</span></label>
    </div>
  </fieldset>
  <div class="form-row">
    <div class="field"><label class="field__label" for="f_company">회사·기관명</label><input class="input" id="f_company" name="company" type="text" placeholder="회사 또는 기관명"></div>
    <div class="field"><label class="field__label" for="f_name">성함 <em>*</em></label><input class="input" id="f_name" name="name" type="text" placeholder="성함을 입력해 주세요" required></div>
  </div>
  <div class="form-row">
    <div class="field"><label class="field__label" for="f_tel">연락처 <em>*</em></label><input class="input" id="f_tel" name="tel" type="tel" placeholder="010-0000-0000" required></div>
    <div class="field"><label class="field__label" for="f_email">이메일 <em>*</em></label><input class="input" id="f_email" name="email" type="email" placeholder="example@email.com" required></div>
  </div>
  <div class="field"><label class="field__label" for="f_msg">문의 내용 <em>*</em></label><textarea class="input input--area" id="f_msg" name="message" placeholder="제품명, 수량, 희망 일정 등을 적어주시면 더 빠르게 안내해 드립니다." required></textarea></div>
  <div class="agree">
    <label class="check"><input type="checkbox" name="agree" required><span>개인정보 수집·이용에 동의합니다 (필수)</span></label>
    <button type="button" class="agree__more" data-modal-open="privacy">전문 보기</button>
  </div>
  <button type="submit" class="btn-submit">문의 보내기</button>
</form>
<div class="modal" id="modal-privacy" role="dialog" aria-modal="true" aria-labelledby="modal-privacy-title" hidden>
  <div class="modal__box">
    <h3 id="modal-privacy-title">개인정보 수집·이용 동의</h3>
    <div class="modal__body">
      <p><b>수집 항목</b> 성함, 연락처, 이메일, 회사·기관명(선택)</p>
      <p><b>수집 목적</b> 문의 확인 및 답변, 상담 안내</p>
      <p><b>보유 기간</b> 문의 처리 완료 후 1년 보관 후 파기</p>
      <p>동의를 거부할 수 있으며, 거부 시 문의 접수가 제한됩니다.</p>
    </div>
    <button type="button" class="btn btn--navy btn--sm" data-modal-close>확인</button>
  </div>
</div>
