<!-- title: 인증현황 | menu: company | crumb: 인증현황 | css: sub | js: sub -->
<section class="cert">
  <div class="inner">
    <div class="sec-head reveal">
      <span class="eyebrow eyebrow--cyan">CERTIFICATION</span>
      <h2 class="sec-title">믿을 수 있는 품질 기준</h2>
      <p class="sec-desc">유원플러스팜이 공급하는 제품은 국내외 품질·안전 기준에 맞춰 관리되는 제조사에서 생산됩니다.</p>
    </div>
    <ul class="cert__grid">
      <li><button type="button" class="cert__item reveal" data-lightbox="images/cert/cert-01-kgmp.png" data-title="KGMP 적합인정서" aria-label="KGMP 적합인정서 크게 보기">
        <span class="cert__thumb"><img src="images/cert/cert-01-kgmp.png" alt="KGMP 적합인정서" loading="lazy"><span class="cert__zoom" aria-hidden="true"><svg viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="m10.5 10.5 3 3M5 7h4M7 5v4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></span></span>
        <span class="cert__text"><b>KGMP 적합인정서</b><span>의료기기 제조 및 품질관리 기준</span><em>워터테이크코리아메디칼</em></span>
      </button></li>
      <li><button type="button" class="cert__item reveal" data-lightbox="images/cert/cert-02-mfds.png" data-title="의료기기 제조인증서" aria-label="의료기기 제조인증서 크게 보기">
        <span class="cert__thumb"><img src="images/cert/cert-02-mfds.png" alt="의료기기 제조인증서" loading="lazy"><span class="cert__zoom" aria-hidden="true"><svg viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="m10.5 10.5 3 3M5 7h4M7 5v4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></span></span>
        <span class="cert__text"><b>의료기기 제조인증서</b><span>식품의약품안전처</span><em>워터테이크코리아메디칼</em></span>
      </button></li>
      <li><button type="button" class="cert__item reveal" data-lightbox="images/cert/cert-03-iso13485.png" data-title="ISO 13485" aria-label="ISO 13485 크게 보기">
        <span class="cert__thumb"><img src="images/cert/cert-03-iso13485.png" alt="ISO 13485" loading="lazy"><span class="cert__zoom" aria-hidden="true"><svg viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="m10.5 10.5 3 3M5 7h4M7 5v4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></span></span>
        <span class="cert__text"><b>ISO 13485</b><span>의료기기 품질경영시스템</span><em>더마글루</em></span>
      </button></li>
      <li><button type="button" class="cert__item reveal" data-lightbox="images/cert/cert-04-fda.png" data-title="FDA 등록" aria-label="FDA 등록 크게 보기">
        <span class="cert__thumb"><img src="images/cert/cert-04-fda.png" alt="FDA 등록" loading="lazy"><span class="cert__zoom" aria-hidden="true"><svg viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="m10.5 10.5 3 3M5 7h4M7 5v4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></span></span>
        <span class="cert__text"><b>FDA 등록</b><span>미국 FDA (Certificate to Foreign Government)</span><em>더마글루</em></span>
      </button></li>
      <li><button type="button" class="cert__item reveal" data-lightbox="images/cert/cert-05-iso9001.png" data-title="ISO 9001" aria-label="ISO 9001 크게 보기">
        <span class="cert__thumb"><img src="images/cert/cert-05-iso9001.png" alt="ISO 9001" loading="lazy"><span class="cert__zoom" aria-hidden="true"><svg viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="m10.5 10.5 3 3M5 7h4M7 5v4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></span></span>
        <span class="cert__text"><b>ISO 9001</b><span>품질경영시스템</span><em>더마글루</em></span>
      </button></li>
      <li><button type="button" class="cert__item reveal" data-lightbox="images/cert/cert-06-iso14001.png" data-title="ISO 14001" aria-label="ISO 14001 크게 보기">
        <span class="cert__thumb"><img src="images/cert/cert-06-iso14001.png" alt="ISO 14001" loading="lazy"><span class="cert__zoom" aria-hidden="true"><svg viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="m10.5 10.5 3 3M5 7h4M7 5v4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></span></span>
        <span class="cert__text"><b>ISO 14001</b><span>환경경영시스템</span><em>더마글루</em></span>
      </button></li>
      <li><button type="button" class="cert__item reveal" data-lightbox="images/cert/cert-07-iso45001.png" data-title="ISO 45001" aria-label="ISO 45001 크게 보기">
        <span class="cert__thumb"><img src="images/cert/cert-07-iso45001.png" alt="ISO 45001" loading="lazy"><span class="cert__zoom" aria-hidden="true"><svg viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="m10.5 10.5 3 3M5 7h4M7 5v4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></span></span>
        <span class="cert__text"><b>ISO 45001</b><span>안전보건경영시스템</span><em>더마글루</em></span>
      </button></li>
    </ul>
    <p class="cert__note">인증서를 누르면 크게 볼 수 있습니다.</p>
  </div>
</section>
<div class="lightbox" role="dialog" aria-modal="true" aria-label="인증서 크게 보기" hidden>
  <img src="" alt="">
  <button type="button" class="lightbox__close" aria-label="닫기">×</button>
</div>
